<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef2fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="280" fill="#8250df" opacity="0.08"/>
  <circle cx="120" cy="560" r="300" fill="#0969da" opacity="0.07"/>

  <!-- 브랜드 -->
  <g transform="translate(80,72)">
    <rect width="44" height="44" rx="11" fill="url(#brand)"/>
    <text x="22" y="31" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">P</text>
    <text x="60" y="30" fill="#1f2328" font-size="24" font-weight="700">Patent Insight</text>
  </g>
  <text x="80" y="124" fill="#59636e" font-size="17" font-weight="600" letter-spacing="0.5">AI 특허 가치 분석 리포트</text>

  <!-- 타이틀 -->
  <text x="80" y="248" fill="#1f2328" font-size="60" font-weight="800" letter-spacing="-1">특허 PDF 한 장으로</text>
  <text x="80" y="328" font-size="60" font-weight="800" letter-spacing="-1">
    <tspan fill="url(#brand)">시장·기술·권리</tspan><tspan fill="#1f2328">를 분석</tspan>
  </text>

  <!-- 부제 -->
  <text x="82" y="392" fill="#59636e" font-size="25" font-weight="500">종합 점수 · 유사 기업 추천 · M&amp;A 패턴까지 한 번에</text>

  <!-- 점수 카드 4개 -->
  <g transform="translate(80,452)">
    <!-- 종합 100 -->
    <g>
      <rect width="248" height="118" rx="16" fill="#ffffff" stroke="#d0d7de"/>
      <rect width="248" height="5" rx="2.5" fill="url(#bar)"/>
      <text x="24" y="74" fill="#0969da" font-size="46" font-weight="800" letter-spacing="-2">100</text>
      <text x="24" y="100" fill="#59636e" font-size="16" font-weight="600">종합 평가 점수</text>
    </g>
    <!-- M&A 50 -->
    <g transform="translate(268,0)">
      <rect width="200" height="118" rx="16" fill="#ffffff" stroke="#d0d7de"/>
      <rect width="200" height="5" rx="2.5" fill="#9a6700"/>
      <text x="24" y="74" fill="#9a6700" font-size="46" font-weight="800" letter-spacing="-2">50</text>
      <text x="24" y="100" fill="#59636e" font-size="16" font-weight="600">M&amp;A 시장</text>
    </g>
    <!-- 기술 25 -->
    <g transform="translate(488,0)">
      <rect width="180" height="118" rx="16" fill="#ffffff" stroke="#d0d7de"/>
      <rect width="180" height="5" rx="2.5" fill="#1a7f37"/>
      <text x="24" y="74" fill="#1a7f37" font-size="46" font-weight="800" letter-spacing="-2">25</text>
      <text x="24" y="100" fill="#59636e" font-size="16" font-weight="600">기술성</text>
    </g>
    <!-- 권리 25 -->
    <g transform="translate(688,0)">
      <rect width="180" height="118" rx="16" fill="#ffffff" stroke="#d0d7de"/>
      <rect width="180" height="5" rx="2.5" fill="#0f766e"/>
      <text x="24" y="74" fill="#0f766e" font-size="46" font-weight="800" letter-spacing="-2">25</text>
      <text x="24" y="100" fill="#59636e" font-size="16" font-weight="600">권리성</text>
    </g>
  </g>

  <!-- 우측 도넛 장식 -->
  <g transform="translate(1000,300)">
    <circle r="118" fill="none" stroke="#e8edf3" stroke-width="22"/>
    <circle r="118" fill="none" stroke="url(#brand)" stroke-width="22" stroke-linecap="round"
      stroke-dasharray="741.4" stroke-dashoffset="222" transform="rotate(-90)"/>
    <text y="6" text-anchor="middle" fill="#1f2328" font-size="56" font-weight="800" letter-spacing="-2">70</text>
    <text y="44" text-anchor="middle" fill="#59636e" font-size="18" font-weight="600">/ 100</text>
  </g>
</svg>
