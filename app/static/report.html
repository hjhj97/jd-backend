<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>특허 분석 리포트</title>
<style>
  :root {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --surface3: #f0f0f0;
    --border: #d0d7de;
    --text: #1f2328;
    --text-muted: #59636e;
    --blue: #0969da;
    --green: #1a7f37;
    --yellow: #9a6700;
    --purple: #8250df;
    --cyan: #0f766e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; letter-spacing: 0; }
  header { background: linear-gradient(135deg, #fbfdff 0%, #eef4ff 100%); border-bottom: 1px solid var(--border); padding: 26px 48px 28px; opacity: 0; transform: translateY(-8px); animation: headerIn .55s cubic-bezier(.2,.75,.2,1) forwards; }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .header-top-right { display: flex; align-items: center; gap: 12px; }
  .new-analysis-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 650; color: var(--blue); text-decoration: none; border: 1px solid #b6d0f7; background: #fff; padding: 5px 12px; border-radius: 8px; transition: background .15s, border-color .15s; white-space: nowrap; }
  .new-analysis-link:hover { background: #eef5ff; border-color: var(--blue); }
  .requested-at { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
  .badge { display: inline-block; background: #e7f0ff; color: var(--blue); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  header h1 { font-size: 22px; font-weight: 700; line-height: 1.4; max-width: 800px; margin-bottom: 16px; }
  .meta { display: flex; gap: 24px; flex-wrap: wrap; }
  .meta-item { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-muted); }
  .meta-item strong { color: var(--text); }

  main { max-width: 1200px; margin: 0 auto; padding: 40px 48px; display: grid; gap: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 28px; box-shadow: 0 1px 2px rgba(31,35,40,.04); }
  .card-title { font-size: 13px; font-weight: 700; color: #334155; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 20px; }

  /* ---- 종합 점수: 도넛 + 막대 ---- */
  .score-overview { display: grid; grid-template-columns: 220px 1fr; gap: 32px; align-items: center; }
  .donut-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .donut { position: relative; width: 180px; height: 180px; }
  .donut svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .donut-track { fill: none; stroke: #e8edf3; stroke-width: 16; }
  .donut-fill { fill: none; stroke: url(#donutGrad); stroke-width: 16; stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1); }
  /* hover 시 분할되는 평가 요인별 세그먼트 */
  .donut-seg { fill: none; stroke-width: 16; cursor: pointer; opacity: 0; transition: opacity .3s ease, stroke-width .2s ease; }
  .donut.split .donut-fill { opacity: 0; }
  .donut.split .donut-seg { opacity: 1; }
  .donut.split .donut-seg.dim { opacity: .25; }
  .donut.split .donut-seg.focus { stroke-width: 19; }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .donut-score { font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -2px; background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; transition: color .2s; }
  .donut-score.seg-val { -webkit-text-fill-color: currentColor; background: none; }
  .donut-max { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .donut-label { font-size: 12px; font-weight: 700; color: #334155; letter-spacing: .04em; transition: color .2s; }
  .donut-hint { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; opacity: .75; }

  .score-bars { display: flex; flex-direction: column; gap: 18px; }
  .score-bar-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 14px; align-items: center; cursor: pointer; border-radius: 10px; padding: 4px 8px; margin: -4px -8px; transition: background .15s; }
  .score-bar-row:hover { background: var(--surface2); }
  .score-bar-label { font-size: 13px; font-weight: 700; color: #334155; }
  .score-bar-track { height: 12px; background: #eaeef3; border-radius: 999px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 999px; width: 0; transition: width 1.1s cubic-bezier(.3,.8,.3,1); }
  .score-bar-row.market .score-bar-fill { background: linear-gradient(90deg, #d4a017, var(--yellow)); }
  .score-bar-row.tech .score-bar-fill { background: linear-gradient(90deg, #2da44e, var(--green)); }
  .score-bar-row.rights .score-bar-fill { background: linear-gradient(90deg, #14b8a6, var(--cyan)); }
  .score-bar-val { font-size: 14px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .score-bar-val .denom { font-size: 12px; font-weight: 700; color: var(--text-muted); }
  .score-bar-row.market .score-bar-val { color: var(--yellow); }
  .score-bar-row.tech .score-bar-val { color: var(--green); }
  .score-bar-row.rights .score-bar-val { color: var(--cyan); }

  .eval-text { font-size: 14px; color: var(--text-muted); line-height: 1.8; margin-top: 12px; white-space: pre-line; }
  .eval-text.highlight { color: var(--text); background: var(--surface2); border-left: 3px solid var(--blue); padding: 14px 18px; border-radius: 0 8px 8px 0; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

  .naics-primary { background: var(--surface2); border: 1px solid var(--blue); border-radius: 10px; padding: 20px; margin-bottom: 14px; }
  .naics-code { font-size: 28px; font-weight: 800; color: var(--blue); letter-spacing: -1px; }
  .naics-title { font-size: 15px; font-weight: 600; margin: 6px 0 4px; }
  .naics-desc { font-size: 12px; color: var(--text-muted); line-height: 1.6; }

  .ipc-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .ipc-chip { background: #e7f0ff; border: 1px solid #b6d0f7; border-radius: 8px; padding: 10px 14px; }
  .ipc-chip .code { font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 4px; }
  .ipc-chip .desc { font-size: 11px; color: var(--text-muted); }

  .patent-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .patent-table td { padding: 10px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  .patent-table td:first-child { color: var(--text-muted); width: 140px; }
  .patent-table tr:last-child td { border-bottom: none; }

  .tab-wrap { display: flex; gap: 4px; margin-bottom: 22px; background: #eef2f7; border: 1px solid #d8e0ea; border-radius: 10px; padding: 5px; width: fit-content; }
  .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 13px; font-weight: 650; padding: 9px 22px; border-radius: 7px; cursor: pointer; transition: color .15s, background .15s; }
  .tab-btn:hover { color: var(--text); background: rgba(255,255,255,.55); }
  .tab-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(31,35,40,.1); }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: tabFade .24s ease; }
  .eval-pair-list { display: grid; gap: 16px; }
  .eval-pair-list.market-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; }

  /* 탭 상단 점수 헤드라인 (게이지) */
  .eval-headline { display: flex; align-items: center; gap: 22px; background: linear-gradient(135deg, #f7faff, #f1f5fc); border: 1px solid #dde6f2; border-radius: 12px; padding: 20px 24px; margin-bottom: 18px; flex-wrap: wrap; }
  .eval-gauge { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
  .eval-gauge svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .eval-gauge-track { fill: none; stroke: #e2e8f1; stroke-width: 9; }
  .eval-gauge-fill { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1); }
  .eval-gauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .eval-gauge-num { font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .eval-gauge-max { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .eval-headline-meta { flex: 1; min-width: 180px; }
  .eval-headline-title { font-size: 15px; font-weight: 800; color: #1f2937; margin-bottom: 8px; }
  .eval-subscores { display: flex; flex-wrap: wrap; gap: 8px; }

  .eval-pair { background: var(--surface); border: 1px solid #dce4ee; border-radius: 12px; padding: 22px 24px; box-shadow: 0 1px 2px rgba(31,35,40,.03); }
  .market-grid .eval-pair { height: 100%; display: flex; flex-direction: column; }
  .eval-pair-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .eval-pair-icon { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; background: #eef5ff; }
  .eval-pair-title { font-size: 14px; font-weight: 800; color: #1f2937; flex: 1; min-width: 0; }
  .score-chip { display: inline-flex; align-items: baseline; gap: 3px; flex-shrink: 0; border: 1px solid #c7d7ee; background: #eef5ff; color: #0757b8; border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 800; line-height: 1; white-space: nowrap; }
  .score-chip .denom { color: #64748b; font-size: 11px; font-weight: 700; }
  .score-chip.subtle { background: #f8fafc; border-color: #d8e0ea; color: #334155; }
  /* 카드 내 미니 점수 막대 */
  .eval-mini-bar { flex: 1; height: 6px; background: #eaeef3; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .eval-mini-bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--blue), #4f9fff); transition: width 1s cubic-bezier(.3,.8,.3,1); }
  .contrib-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .contrib-row .eval-mini-bar { margin-bottom: 0; }
  .contrib-label { font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
  .eval-pair-body { color: var(--text); font-size: 15px; line-height: 2; white-space: pre-line; }
  .perspective-body { white-space: normal; }
  .perspective-body p { margin-bottom: 12px; }
  .perspective-body p:last-child { margin-bottom: 0; }
  .market-grid .eval-pair-body { font-size: 14px; line-height: 1.9; flex: 1; }
  .eval-pair-reason { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e5eaf0; color: #7b8794; font-size: 12px; line-height: 1.85; white-space: pre-line; }
  .eval-pair-reason::before { content: "산출 근거"; display: block; margin-bottom: 8px; color: #94a3b8; font-size: 11px; font-weight: 800; letter-spacing: .05em; }

  .abstract-text { font-size: 13px; color: var(--text-muted); line-height: 1.9; background: var(--surface2); padding: 18px 20px; border-radius: 8px; border-left: 3px solid var(--border); white-space: pre-line; }
  .reason-block { background: #f8fafc; border: 1px solid #d8e0ea; border-radius: 8px; padding: 18px 20px; margin-top: 10px; font-size: 13px; color: #4b5563; line-height: 1.85; white-space: pre-line; }

  .company-list { display: flex; flex-direction: column; gap: 14px; }
  .company-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color .2s; }
  .company-card:hover { border-color: #9ec4f4; }
  .company-header { display: flex; align-items: center; gap: 14px; padding: 18px 20px; cursor: pointer; user-select: none; }
  .company-rank { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; font-weight: 800; flex-shrink: 0; background: linear-gradient(135deg, #e7f0ff, #f2ecff); color: var(--blue); border: 1px solid #b6d0f7; }
  .company-info { flex: 1; min-width: 0; }
  .company-name { font-size: 15px; font-weight: 700; }
  .company-meta { display: flex; gap: 16px; margin-top: 4px; font-size: 12px; color: var(--text-muted); }
  .company-meta .val { color: var(--text); font-weight: 600; }
  .company-chevron { font-size: 14px; color: var(--text-muted); transition: transform .25s; flex-shrink: 0; }
  .company-card.open .company-chevron { transform: rotate(180deg); }
  .company-patents { max-height: 0; overflow: hidden; transition: max-height .35s cubic-bezier(.4,0,.2,1); }
  .company-card.open .company-patents { max-height: 3000px; }
  .company-patents-inner { padding: 0 20px 18px; border-top: 1px solid var(--border); }

  .patent-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 10px; font-size: 13px; cursor: pointer; transition: border-color .2s; }
  .patent-item:hover { border-color: #9ec4f4; }
  .patent-item-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .patent-item-title-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .patent-item-title-text { font-weight: 600; }
  .country-pill { font-size: 11px; font-weight: 700; background: #e7f0ff; color: #0969da; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .patent-item-chevron { font-size: 12px; color: var(--text-muted); transition: transform .25s; flex-shrink: 0; }
  .patent-item.open .patent-item-chevron { transform: rotate(180deg); }
  .patent-item-ipc { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .ipc-tag { font-size: 10px; font-weight: 600; color: var(--blue); background: #eef5ff; border: 1px solid #bfd4f4; border-radius: 4px; padding: 2px 7px; }
  .patent-item-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .patent-item-abstract { font-size: 11px; color: var(--text-muted); line-height: 1.7; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .patent-item.open .patent-item-abstract { display: block; -webkit-line-clamp: initial; -webkit-box-orient: initial; overflow: visible; }

  .pattern-list { display: grid; gap: 10px; }
  .pattern-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .pattern-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .pattern-reason { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.7; }
  .muted { font-size: 13px; color: var(--text-muted); }
  .reveal-item { opacity: 0; transform: translateY(14px); animation: sectionIn .55s cubic-bezier(.2,.75,.2,1) forwards; }

  @keyframes headerIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes sectionIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes tabFade {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 768px) {
    main { padding: 24px 20px; }
    header { padding: 28px 20px; }
    .score-overview { grid-template-columns: 1fr; gap: 24px; justify-items: center; }
    .score-bars { width: 100%; }
    .score-bar-row { grid-template-columns: 96px 1fr auto; gap: 10px; }
    .two-col { grid-template-columns: 1fr; }
    .tab-wrap { width: 100%; overflow-x: auto; }
    .tab-btn { flex: 1 0 auto; padding: 8px 14px; }
    .eval-pair-list.market-grid { grid-template-columns: 1fr; }
    .eval-subscores { gap: 6px; }
    .eval-pair { padding: 18px 20px; }
    .eval-headline { gap: 16px; padding: 16px 18px; }
    .eval-pair-body { font-size: 14px; line-height: 1.9; }
    .patent-item-head { align-items: flex-start; }
  }

  /* --- 동적 상태(로딩/에러) --- */
  .state-screen { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 40px; }
  .spinner { width: 38px; height: 38px; border: 4px solid #c8d4e3; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-title { font-size: 18px; font-weight: 700; }
  .state-sub { font-size: 14px; color: var(--text-muted); }
  .state-screen.error .state-title { color: #cf222e; }
  .back-link { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--blue); text-decoration: none; border: 1px solid var(--border); padding: 8px 18px; border-radius: 8px; }
  .back-link:hover { background: var(--surface2); }
  .pattern-item strong { color: var(--blue); }
  .load-bar { width: 280px; max-width: 80vw; height: 6px; background: #e1e8f0; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .load-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--purple)); border-radius: 4px; transition: width .5s ease; }

  /* --- 로딩 스켈레톤 --- */
  .sk { background: #e9eef4; border-radius: 8px; position: relative; overflow: hidden; }
  .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.65) 50%, transparent);
    animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .skeleton-wrap { animation: skFade .4s ease; }
  @keyframes skFade { from { opacity: 0; } to { opacity: 1; } }

  /* 로딩 진행 배너 (헤더 영역에 오버레이) */
  .load-banner { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .load-banner .spinner { width: 30px; height: 30px; border-width: 3px; flex-shrink: 0; }
  .load-banner-text { flex: 1; min-width: 200px; text-align: left; }
  .load-banner-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .load-banner-sub { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

  /* 단계 스텝퍼 */
  .stepper { display: flex; gap: 0; margin: 18px 0 4px; }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; }
  .step::before { content: ''; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: #d8e0ea; z-index: 0; }
  .step:first-child::before { display: none; }
  .step.done::before, .step.active::before { background: var(--blue); }
  .step-dot { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid #d8e0ea; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--text-muted); transition: all .35s ease; }
  .step.done .step-dot { background: var(--blue); border-color: var(--blue); color: #fff; }
  .step.active .step-dot { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 0 4px rgba(9,105,218,.15); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px rgba(9,105,218,.15); } 50% { box-shadow: 0 0 0 7px rgba(9,105,218,.05); } }
  .step-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-align: center; transition: color .35s ease; }
  .step.active .step-label, .step.done .step-label { color: var(--text); }

  .sk-score-grid { display: grid; grid-template-columns: 220px 1fr; gap: 32px; align-items: center; }
  .sk-bars { display: flex; flex-direction: column; gap: 18px; }
  .sk-bar-row { display: grid; grid-template-columns: 130px 1fr; gap: 14px; align-items: center; }
  @media (max-width: 768px) {
    .sk-score-grid { grid-template-columns: 1fr; gap: 24px; justify-items: center; }
    .stepper { flex-wrap: wrap; gap: 12px; }
    .step::before { display: none; }
    .step { flex: 1 0 40%; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const API_BASE = "/api/v1";

// URL: /result/{task_id}
function getTaskId() {
  const parts = window.location.pathname.split("/").filter(Boolean);
  return parts[parts.length - 1];
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function pct(x) { return (Number(x) * 100).toFixed(2) + "%"; }
function fmtDate(s) {
  if (!s) return "-";
  const t = String(s);
  if (/^\d{8}$/.test(t)) return t.slice(0, 4) + "-" + t.slice(4, 6) + "-" + t.slice(6, 8);
  return t;
}
// ISO 시각을 한국시간(KST) "YYYY-MM-DD HH:mm" 으로 표시
function fmtKST(s) {
  if (!s) return null;
  const d = new Date(s);
  if (isNaN(d.getTime())) return null;
  const p = new Intl.DateTimeFormat("ko-KR", {
    timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(d).reduce((o, x) => (o[x.type] = x.value, o), {});
  return p.year + "-" + p.month + "-" + p.day + " " + p.hour + ":" + p.minute + " (KST)";
}

// 처리 단계 정의 (UX용). 실제 worker state: queued / PARSING / JDPATENT_SUBMIT / JDPATENT_PROCESSING
const STAGES = [
  { key: "queued",              step: "대기",      label: "대기 중…",                  title: "분석 대기 중",         sub: "요청이 접수되었습니다. 곧 분석을 시작합니다.",   pct: 10 },
  { key: "PARSING",             step: "문서 파싱", label: "특허 문서 파싱 중…",        title: "특허 문서를 읽는 중",  sub: "PDF에서 텍스트와 도면을 추출하고 있습니다.",     pct: 30 },
  { key: "JDPATENT_SUBMIT",     step: "분석 등록", label: "특허 분석 작업 등록 중…",   title: "분석 작업 등록 중",    sub: "추출한 정보로 분석 작업을 준비하고 있습니다.",   pct: 50 },
  { key: "JDPATENT_PROCESSING", step: "특허 분석", label: "특허 분석 중… (결과 대기)", title: "특허를 분석하는 중",   sub: "시장성·기술성·권리성과 유사 기업을 분석합니다.", pct: 78 },
  { key: "completed",           step: "리포트",    label: "리포트 생성 중…",           title: "리포트를 완성하는 중", sub: "거의 다 됐습니다.",                              pct: 96 },
];
function stageIndex(key) {
  const i = STAGES.findIndex(s => s.key === key);
  return i < 0 ? 0 : i;
}
const FAILURE_MSG = {
  not_a_patent_document: "업로드한 문서가 특허 문서가 아닙니다.",
  runpod_pdf_too_large: "OCR 처리 가능한 파일 크기를 초과했습니다.",
  runpod_timeout: "OCR 처리 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.",

};

let loadingMounted = false;

// 스켈레톤 한 칸
function skel(w, h, extra) {
  return '<div class="sk" style="width:' + w + ';height:' + h + 'px;' + (extra || "") + '"></div>';
}
// 로딩 화면(스켈레톤 + 진행 배너 + 스텝퍼)을 최초 1회만 그린다.
function mountLoading() {
  let h = '<div class="skeleton-wrap">';
  // 진행 배너 + 스텝퍼 (헤더 카드)
  h += '<header style="padding-bottom:28px;">' +
    '<div class="load-banner">' +
    '<div class="spinner"></div>' +
    '<div class="load-banner-text">' +
    '<div class="load-banner-title" id="loadingTitle">분석 진행 중…</div>' +
    '<div class="load-banner-sub" id="loadingSub">특허를 분석하고 있습니다. 보통 5~7분 정도 소요됩니다.</div>' +
    '</div>' +
    '</div>' +
    '<div class="stepper" id="stepper">' +
    STAGES.filter(s => s.key !== "completed").map((s, i) =>
      '<div class="step" data-step="' + i + '"><div class="step-dot">' + (i + 1) +
      '</div><div class="step-label">' + esc(s.step) + "</div></div>").join("") +
    "</div>" +
    '<div class="load-bar" style="width:100%;max-width:none;margin-top:18px;"><i id="loadBar"></i></div>' +
    "</header>";

  h += '<main>';
  // 종합 점수 카드 스켈레톤 (도넛 + 막대)
  h += '<div class="card">' + skel("160px", 13, "margin-bottom:24px;") +
    '<div class="sk-score-grid"><div style="display:flex;flex-direction:column;align-items:center;gap:14px;">' +
    skel("180px", 180, "border-radius:50%;") + skel("80px", 12) + "</div>" +
    '<div class="sk-bars">' +
    [0, 1, 2].map(() => '<div class="sk-bar-row">' + skel("100%", 14) + skel("100%", 12) + "</div>").join("") +
    "</div></div></div>";
  // 2단 카드 스켈레톤
  h += '<div class="two-col">' +
    skCard([18, 14, 14, 14, 14, 60]) +
    skCard([18, 40, 40, 40]) +
    "</div>";
  // 세부 평가 카드 스켈레톤
  h += '<div class="card">' + skel("120px", 13, "margin-bottom:18px;") +
    '<div style="display:flex;gap:8px;margin-bottom:20px;">' +
    skel("90px", 36) + skel("90px", 36) + skel("90px", 36) + "</div>" +
    skel("100%", 90, "margin-bottom:16px;") +
    skel("100%", 140) + "</div>";
  h += "</main></div>";

  document.getElementById("app").innerHTML = h;
  loadingMounted = true;
}
function skCard(rows) {
  let h = '<div class="card">';
  rows.forEach((rh, i) => h += skel(i === 0 ? "140px" : (i % 3 === 0 ? "70%" : "100%"), rh, "margin-bottom:14px;"));
  return h + "</div>";
}
// 단계 변화 시 배너/스텝퍼/진행바만 갱신 (스켈레톤 shimmer는 유지)
function updateLoading(stageKey) {
  const s = STAGES[stageIndex(stageKey)] || STAGES[0];
  const idx = stageIndex(stageKey);
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  set("loadingTitle", s.title);
  set("loadingSub", s.sub);
  const bar = document.getElementById("loadBar");
  if (bar) bar.style.width = s.pct + "%";
  document.querySelectorAll("#stepper .step").forEach((el, i) => {
    el.classList.toggle("done", i < idx);
    el.classList.toggle("active", i === idx);
    if (i < idx) el.querySelector(".step-dot").textContent = "✓";
    else el.querySelector(".step-dot").textContent = i + 1;
  });
}

async function load() {
  if (!loadingMounted) mountLoading();
  const taskId = getTaskId();
  let data;
  try {
    const res = await fetch(API_BASE + "/result/" + encodeURIComponent(taskId));
    data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.msg || ("HTTP " + res.status));
  } catch (err) {
    // 네트워크 일시 오류는 멈추지 않고 재시도
    setTimeout(load, 2500);
    return;
  }

  if (data.status === "completed" && data.result) {
    render(data.result, data.requested_at);
    return;
  }

  // 실패는 항상 success:false 로 온다 (failed / not_a_patent_document / *_timeout 등).
  // 그 외 success !== false 인 모든 상태(PARSING, JDPATENT_PROCESSING 등)는 "진행 중"이다.
  if (data.success === false) {
    const msg = FAILURE_MSG[data.status] || data.msg || ("상태: " + (data.status || "알 수 없음"));
    return renderError("분석에 실패했습니다.", msg);
  }

  // 진행 중 — 단계 표시 후 재폴링
  updateLoading(data.status || "queued");
  setTimeout(load, 2500);
}

// ---- 렌더 헬퍼 ----
function metaItem(label, val) {
  return '<div class="meta-item">' + esc(label) + " <strong>" + esc(val) + "</strong></div>";
}
// 종합 점수 도넛 (SVG, 외부 라이브러리 없음).
// 평소: 종합점수 단일 그라데이션 링. hover: 평가 요인별(M&A/기술/권리) 세그먼트로 분할.
// 세그먼트 호 길이 = 해당 요인 점수(점). 셋의 합이 곧 종합점수이므로 채움 정도가 일치한다.
function donut(val, max, factors) {
  const has = val != null && val !== "";
  const pctNum = has ? Math.max(0, Math.min(1, Number(val) / max)) : 0;
  const r = 78, c = 2 * Math.PI * r;

  // 세그먼트: 각 요인 점수를 max(=100) 기준 호 길이로, 종합점수 시작점부터 이어 붙인다.
  let segHtml = "", cursor = 0;
  factors.forEach((f, i) => {
    const sc = (f.score == null || f.score === "") ? 0 : Number(f.score);
    const frac = Math.max(0, Math.min(1, sc / max));            // 전체(100) 대비 비중
    const len = c * frac;
    const gap = 1.5;                                            // 세그먼트 사이 미세 간격
    const dash = Math.max(0, len - gap) + " " + (c - Math.max(0, len - gap));
    const offset = -c * cursor;                                 // 시작 위치 (회전 누적)
    segHtml += '<circle class="donut-seg" data-seg="' + i + '" cx="90" cy="90" r="' + r + '" ' +
      'stroke="' + f.colorHex + '" stroke-dasharray="' + dash + '" stroke-dashoffset="' + offset.toFixed(1) + '" ' +
      'onmouseenter="donutFocus(this,' + i + ')" onmouseleave="donutBlur(this)" ' +
      'onclick="switchTabById(\'' + f.tab + '\')"></circle>';
    cursor += frac;
  });

  const segData = factors.map(f => ({
    label: f.label, score: (f.score == null ? "-" : f.score), max: f.max, color: f.colorHex
  }));

  return '<div class="donut-wrap"><div class="donut" id="scoreDonut" data-total="' + (has ? esc(val) : "-") +
    '" data-segs=\'' + esc(JSON.stringify(segData)) + '\' ' +
    'onmouseenter="this.classList.add(\'split\')" onmouseleave="donutReset()">' +
    '<svg viewBox="0 0 180 180">' +
    '<defs><linearGradient id="donutGrad" x1="0%" y1="0%" x2="100%" y2="100%">' +
    '<stop offset="0%" stop-color="#0969da"/><stop offset="100%" stop-color="#8250df"/>' +
    '</linearGradient></defs>' +
    '<circle class="donut-track" cx="90" cy="90" r="' + r + '"></circle>' +
    '<circle class="donut-fill" cx="90" cy="90" r="' + r + '" ' +
    'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + c.toFixed(1) +
    '" data-offset="' + (c * (1 - pctNum)).toFixed(1) + '"></circle>' +
    segHtml + "</svg>" +
    '<div class="donut-center" id="donutCenter">' +
    '<div class="donut-score" id="donutScore">' + (has ? esc(val) : "-") +
    '</div><div class="donut-max" id="donutMax">/ ' + max + "</div></div></div>" +
    '<div class="donut-label" id="donutLabel">종합 점수</div>' +
    '<div class="donut-hint">마우스를 올려 요인별 점수 보기</div></div>';
}
function scoreBar(f) {
  const has = f.score != null && f.score !== "";
  const pctNum = has ? Math.max(0, Math.min(100, (Number(f.score) / f.max) * 100)) : 0;
  return '<div class="score-bar-row ' + f.cls + '" onclick="switchTabById(\'' + f.tab + '\')" ' +
    'title="' + esc(f.label) + ' 세부 평가 보기">' +
    '<div class="score-bar-label">' + esc(f.label) + "</div>" +
    '<div class="score-bar-track"><div class="score-bar-fill" data-pct="' + pctNum.toFixed(1) + '"></div></div>' +
    '<div class="score-bar-val">' + (has ? esc(f.score) : "-") +
    '<span class="denom"> / ' + f.max + "</span></div></div>";
}
function row(label, val) {
  if (val == null || val === "") return "";
  return "<tr><td>" + esc(label) + "</td><td>" + esc(val) + "</td></tr>";
}
function scoreChip(label, score, max, subtle) {
  if (score == null || score === "") return "";
  let h = '<span class="score-chip' + (subtle ? " subtle" : "") + '">' + esc(label) + " " + esc(score);
  if (max != null) h += '<span class="denom">/ ' + esc(max) + "</span>";
  return h + "</span>";
}
function evalScoreSummary(items) {
  const chips = items.map(item => scoreChip(item.label, item.score, item.max, item.subtle)).filter(Boolean);
  return chips.length ? '<div class="eval-subscores">' + chips.join("") + "</div>" : "";
}
// 탭 상단 게이지 헤드라인 (점수 가독성)
function evalHeadline(title, score, max, color, subChips) {
  const has = score != null && score !== "";
  const pctNum = has ? Math.max(0, Math.min(1, Number(score) / max)) : 0;
  const r = 42, c = 2 * Math.PI * r;
  let h = '<div class="eval-headline"><div class="eval-gauge"><svg viewBox="0 0 96 96">' +
    '<circle class="eval-gauge-track" cx="48" cy="48" r="' + r + '"></circle>' +
    '<circle class="eval-gauge-fill" cx="48" cy="48" r="' + r + '" stroke="' + color + '" ' +
    'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + c.toFixed(1) +
    '" data-offset="' + (c * (1 - pctNum)).toFixed(1) + '"></circle></svg>' +
    '<div class="eval-gauge-center"><div class="eval-gauge-num" style="color:' + color + '">' +
    (has ? esc(score) : "-") + '</div><div class="eval-gauge-max">/ ' + max + "</div></div></div>";
  h += '<div class="eval-headline-meta"><div class="eval-headline-title">' + esc(title) + "</div>";
  h += (subChips || "") + "</div></div>";
  return h;
}
function evalPair(title, evalText, reason, score, max, icon, color, withMiniBar) {
  let h = '<div class="eval-pair">';
  h += '<div class="eval-pair-head">';
  if (icon) h += '<div class="eval-pair-icon">' + icon + "</div>";
  h += '<div class="eval-pair-title">' + esc(title) + "</div>";
  h += scoreChip("점수", score, max, false) + "</div>";
  if (withMiniBar && score != null && score !== "" && max != null) {
    const p = Math.max(0, Math.min(100, (Number(score) / max) * 100));
    h += '<div class="eval-mini-bar"><i data-pct="' + p.toFixed(1) +
      '" style="background:linear-gradient(90deg,' + (color || "var(--blue)") + ',#7cb0ff)"></i></div>';
  }
  h += '<div class="eval-pair-body">' + esc(evalText || "(내용 없음)") + "</div>";
  if (reason) h += '<div class="eval-pair-reason">' + esc(reason) + "</div>";
  return h + "</div>";
}
function tabContent(id, active, title, evalText, reason, score, max, color) {
  let h = '<div id="' + id + '" class="tab-content' + (active ? " active" : "") + '">';
  h += evalHeadline(title, score, max, color || "var(--blue)", "");
  h += '<div class="eval-pair-list">' +
    evalPair(title, evalText, reason, score, max, null, color) + "</div>";
  return h + "</div>";
}
// 4관점 카드: 점수를 '4관점 합계' 대비 비율 막대로 표시 (개별 만점 미명시)
function marketPerspectiveCard(icon, title, evalText, paragraphs, reason, score, sum) {
  const has = score != null && score !== "";
  // 합계 대비 비율 (합계가 없으면 막대 생략)
  const ratio = (has && sum) ? Math.max(0, Math.min(100, (Number(score) / Number(sum)) * 100)) : null;
  const body = (paragraphs && paragraphs.length)
    ? paragraphs.map(t => '<p>' + esc(t) + "</p>").join("")
    : esc(evalText || "(내용 없음)");

  let h = '<div class="eval-pair">';
  h += '<div class="eval-pair-head">';
  if (icon) h += '<div class="eval-pair-icon">' + icon + "</div>";
  h += '<div class="eval-pair-title">' + esc(title) + "</div>";
  if (has) h += '<span class="score-chip">' + esc(score) + "점</span>";
  h += "</div>";
  if (ratio != null) {
    h += '<div class="contrib-row"><div class="eval-mini-bar"><i data-pct="' + ratio.toFixed(1) +
      '" style="background:linear-gradient(90deg,var(--yellow),#f0c14b)"></i></div>' +
      '<span class="contrib-label">합계의 ' + Math.round(ratio) + "%</span></div>";
  }
  h += '<div class="eval-pair-body perspective-body">' + body + "</div>";
  if (reason) h += '<div class="eval-pair-reason">' + esc(reason) + "</div>";
  return h + "</div>";
}
function marketTabContent(id, active, ma) {
  const p = ma.ma_market_perspectives || {};
  const sum = ma.ma_llm_four_perspectives_sum;
  const items = [
    ["시장 동향", p.field_trend, "ma_market_field_trend_evaluation", "ma_market_field_trend_evaluation_paragraphs", "field_trend_reason", "field_trend_score"],
    ["국경 간 거래", p.crossborder, "ma_market_crossborder_evaluation", "ma_market_crossborder_evaluation_paragraphs", "crossborder_reason", "crossborder_score"],
    ["인수 유형", p.ma_type, "ma_market_ma_type_evaluation", "ma_market_ma_type_evaluation_paragraphs", "ma_type_reason", "ma_type_score"],
    ["하이테크 적합성", p.hightech, "ma_market_hightech_evaluation", "ma_market_hightech_evaluation_paragraphs", "hightech_reason", "hightech_score"],
  ];

  let body = "";
  let pairCount = 0;
  items.forEach(([title, obj, evalKey, paraKey, reasonKey, scoreKey]) => {
    if (!obj) return;
    const evalText = obj[evalKey];
    const reason = obj[reasonKey];
    if (evalText || reason) {
      body += marketPerspectiveCard(null, title, evalText, obj[paraKey], reason, obj[scoreKey], sum);
      pairCount += 1;
    }
  });
  if (!body) body = evalPair("M&A 시장 평가", ma.ma_market_evaluation, ma.ma_market_reason, ma.ma_market_score, 50, null, "var(--yellow)", true);

  const subChips = evalScoreSummary([
    { label: "4관점 합계", score: sum, max: 50 },
    { label: "정량 앵커", score: ma.ma_anchor_score, max: 50, subtle: true },
  ]);
  const headline = evalHeadline("M&A 매력도", ma.ma_market_score, 50, "var(--yellow)", subChips);
  const gridClass = pairCount >= 4 ? "eval-pair-list market-grid" : "eval-pair-list";

  return '<div id="' + id + '" class="tab-content' + (active ? " active" : "") + '">' +
    headline + '<div class="' + gridClass + '">' + body + "</div></div>";
}
function companyCard(title, companies) {
  let h = '<div class="card"><div class="card-title">' + esc(title) + '</div><div class="company-list">';
  if (!companies.length) {
    h += '<div class="muted">추천 기업이 없습니다.</div>';
  }
  companies.forEach(c => {
    const sim = c.avg_similarity != null ? pct(c.avg_similarity) : "-";
    h += '<div class="company-card" onclick="toggleCompany(event,this)"><div class="company-header">' +
      '<div class="company-rank">' + esc(c.rank != null ? c.rank : "") + "</div>" +
      '<div class="company-info"><div class="company-name">' + esc(c.company_name || "") + "</div>" +
      '<div class="company-meta"><span>유사도: <span class="val">' + sim + "</span></span>" +
      '<span>매칭 특허: <span class="val">' + esc(c.matched_patent_count != null ? c.matched_patent_count : "") +
      "</span></span></div></div><div class=\"company-chevron\">▼</div></div>";
    h += '<div class="company-patents"><div class="company-patents-inner">';
    (c.patents || []).forEach(p => {
      h += '<div class="patent-item" onclick="togglePatent(event,this)"><div class="patent-item-head">' +
        '<div class="patent-item-title-wrap"><span class="patent-item-title-text">' +
        esc(p.title || "") + '</span><span class="patent-item-chevron">▼</span></div>' +
        '<span class="country-pill">' + esc(p.patent_country || "") + "</span></div>";
      if (p.ipc && p.ipc.length) {
        h += '<div class="patent-item-ipc">';
        p.ipc.forEach(t => { h += '<span class="ipc-tag">' + esc(t) + "</span>"; });
        h += "</div>";
      }
      h += '<div class="patent-item-meta">출원번호: ' + esc(p.application_number || "-") +
        " · 출원일: " + esc(fmtDate(p.application_date)) +
        " · 유사도: " + (p.similarity != null ? pct(p.similarity) : "-") + "</div>";
      h += '<div class="patent-item-abstract">' + esc(p.abstract || "") + "</div></div>";
    });
    h += "</div></div></div>";
  });
  return h + "</div></div>";
}

// ---- sample.html과 동일한 인터랙션 ----
// 탭 ID로 활성화 (버튼 클릭/도넛·막대 클릭 공용)
function activateTab(tabId) {
  const tab = document.getElementById(tabId);
  if (!tab) return;
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  tab.classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === tabId));
  animateCharts(tab);
}
function switchTab(event, tabId) {
  event.preventDefault();
  activateTab(tabId);
}
// 도넛/막대 클릭 → 세부 평가 해당 탭 활성화 + 스크롤 이동
function switchTabById(tabId) {
  activateTab(tabId);
  const card = document.getElementById("evalCard");
  if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
}

// 도넛 hover: 분할 모드 진입, 특정 세그먼트 강조 + 중앙에 해당 요인 점수 표시
function donutFocus(el, i) {
  const donut = document.getElementById("scoreDonut");
  if (!donut) return;
  donut.classList.add("split");
  donut.querySelectorAll(".donut-seg").forEach(s => {
    s.classList.toggle("focus", s === el);
    s.classList.toggle("dim", s !== el);
  });
  let segs; try { segs = JSON.parse(donut.dataset.segs); } catch (e) { return; }
  const f = segs[i]; if (!f) return;
  const score = document.getElementById("donutScore");
  const max = document.getElementById("donutMax");
  const label = document.getElementById("donutLabel");
  score.textContent = f.score; score.classList.add("seg-val"); score.style.color = f.color;
  max.textContent = "/ " + f.max;
  label.textContent = f.label; label.style.color = f.color;
}
function donutBlur(el) {
  const donut = document.getElementById("scoreDonut");
  if (!donut) return;
  donut.querySelectorAll(".donut-seg").forEach(s => s.classList.remove("focus", "dim"));
}
// 도넛 영역을 벗어나면 종합 점수로 복원
function donutReset() {
  const donut = document.getElementById("scoreDonut");
  if (!donut) return;
  donut.classList.remove("split");
  const score = document.getElementById("donutScore");
  const max = document.getElementById("donutMax");
  const label = document.getElementById("donutLabel");
  if (!score || !donut.dataset.total) return;
  score.textContent = donut.dataset.total; score.classList.remove("seg-val"); score.style.color = "";
  max.textContent = "/ 100";
  label.textContent = "종합 점수"; label.style.color = "";
}
function toggleCompany(event, el) { if (event) event.stopPropagation(); el.classList.toggle("open"); }
function togglePatent(event, el) { if (event) event.stopPropagation(); el.classList.toggle("open"); }

// 도넛/막대/게이지 채우기 애니메이션. data-* 속성에 목표값 보관.
function animateCharts(root) {
  const scope = root || document;
  scope.querySelectorAll(".donut-fill[data-offset], .eval-gauge-fill[data-offset]").forEach(el => {
    el.style.strokeDashoffset = el.getAttribute("data-offset");
  });
  scope.querySelectorAll(".score-bar-fill[data-pct], .eval-mini-bar > i[data-pct]").forEach(el => {
    el.style.width = el.getAttribute("data-pct") + "%";
  });
}
function initEntryAnimations() {
  document.querySelectorAll("main > .card, main > .two-col").forEach((s, i) => {
    s.classList.add("reveal-item");
    s.style.animationDelay = (120 + i * 80) + "ms";
  });
  // 차트는 진입 직후 한 프레임 뒤에 채워 트랜지션이 보이도록 함
  requestAnimationFrame(() => requestAnimationFrame(() => animateCharts(document)));
}

load();
</script>
